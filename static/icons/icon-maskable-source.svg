<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    Convertly app icon — "maskable" purpose.
    Full-bleed background (Android crops to circle/squircle/rounded-square, so
    no rounded corners or border here — they would be cropped inconsistently).
    The C sits inside the 80% safe zone: outer radius 156px < the 204.8px limit.
  -->
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#4ade80"/>
      <stop offset="60%"  stop-color="#a3e635"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="#141418"/>

  <path d="M 320.3 179.4 A 100 100 0 1 0 320.3 332.6"
        fill="none" stroke="url(#g)" stroke-width="56" stroke-linecap="round"/>
</svg>
