<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#4ade80"/>
      <stop offset="60%"  stop-color="#a3e635"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>
  <!-- Dark surface background -->
  <rect width="32" height="32" rx="8" fill="#141418"/>
  <!-- Subtle green border glow -->
  <rect width="32" height="32" rx="8" fill="none" stroke="rgba(74,222,128,0.22)" stroke-width="1.5"/>
  <!-- C letter in brand gradient -->
  <text x="16" y="23" font-family="'DM Sans', system-ui, sans-serif" font-size="20" font-weight="800" fill="url(#g)" text-anchor="middle">C</text>
</svg>
