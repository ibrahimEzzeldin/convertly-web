services:
  - type: web
    name: convertly-web
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_MODE
        sync: false
      - key: PAYPAL_PRICE_USD
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: SESSION_COOKIE_SECURE
        sync: false
      - key: VOUCHER_CODES
        sync: false
      - key: MYMEMORY_EMAIL
        sync: false
      # Optional. When set, DeepL is used as the primary translation engine and
      # MyMemory becomes the fallback. Unset, ALL translation rides MyMemory's
      # free tier (~5k chars/day anonymous, 50k with MYMEMORY_EMAIL), which a
      # single large PDF can exhaust.
      - key: DEEPL_API_KEY
        sync: false
      - key: FLASK_ENV
        sync: false
